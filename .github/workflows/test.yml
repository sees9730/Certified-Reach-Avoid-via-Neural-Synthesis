name: Tests

on:
  push:
    branches: [ main, develop, refactor_utils ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run GV verification tests
      run: |
        python -m pytest tests/test_phi_module.py -v

    - name: Check activation functions
      run: |
        python -m pytest tests/test_activation_functions.py -v

    - name: Smoke test gbm_syn
      run: |
        cd gbm_syn
        timeout 120 python main.py --train=1 || true

    - name: Smoke test gbm_veri
      run: |
        cd gbm_veri
        timeout 120 python main.py --train=1 || true
